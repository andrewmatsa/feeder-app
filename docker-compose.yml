services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      MOCK_DEVICE: ${MOCK_DEVICE:-true}
      ESP32_BASE_URL: ${ESP32_BASE_URL:-http://host.docker.internal}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - ./versions.json:/versions.json:ro
    restart: unless-stopped
    networks:
      - aquafeed

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      BACKEND_URL: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./versions.json:/versions.json:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - aquafeed

networks:
  aquafeed:
    driver: bridge
