services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - ./versions.json:/versions.json:ro
    restart: unless-stopped
    networks:
      - aquafeed

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      # Vite proxy forwards /api and /auth to backend via Docker network
      - BACKEND_URL=http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./versions.json:/versions.json:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - aquafeed

networks:
  aquafeed:
    driver: bridge
