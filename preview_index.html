<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AquaFeed Control</title>
<style>
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  padding: 8px;
  padding-bottom: 75px;
  max-width: 100%;
  margin: auto;
  background: #F5F5F5;
  min-height: 100vh;
  color: #333;
  font-size: 14px;
}
.row {margin-bottom: 8px;}
label {display: block; font-weight: 600; margin-bottom: 4px; color: #2c3e50; font-size: 13px;}
input[type=range], input[type=number], select {width: 95%; padding: 6px; border-radius: 6px; border: 1px solid #ddd; font-size: 13px;}
.flex-row {
  display: flex;
  gap: 4px;
  align-items: center;
  margin-bottom: 6px;
  flex-wrap: wrap;
}
.flex-row span {font-weight: 500; color: #555; font-size: 12px;}
.flex-row input, .flex-row select {width: auto; min-width: 20px; font-size: 12px;}
button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 12px 24px;
  font-size: 13px;
  margin-top: 4px;
  width: 100%;
  border: none;
  border-radius: 999px;
  background: #111;
  color: #fff;
  font-weight: 600;
  letter-spacing: 0.2px;
  cursor: pointer;
  transition: transform 0.15s ease, background 0.2s ease;
}
button:hover {
  transform: translateY(-1px);
  box-shadow: 0 14px 22px rgba(0,0,0,0.2);
}
button:active {
  transform: translateY(0);
  box-shadow: 0 6px 14px rgba(0,0,0,0.16);
}
button.add-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: #fff;
  color: #333;
  border: 1px solid rgba(15, 23, 42, 0.12);
  box-shadow: none;
  width: auto;
  padding: 10px 22px;
  margin: 8px 0;
  transition: background 0.2s ease, color 0.2s ease;
}
button.add-btn:hover {
  background: rgba(15, 23, 42, 0.08);
  color: #111;
}
.card {
  padding: 16px;
  border-radius: 12px;
  background: #FFFFFF;
  margin-bottom: 12px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
}
.battery-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  text-align: center;
  padding: 20px;
}
.battery-info-row {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  gap: 20px;
  width: 100%;
}
.battery-gauge-wrapper {
  position: relative;
  flex: 0 0 150px;
  max-width: 150px;
  margin: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
.battery-title {
  font-size: 14px;
  font-weight: 600;
  color: #222;
}
.battery-subtitle {
  font-size: 12px;
  color: #888;
}
.battery-gauge-svg {
  width: 100%;
  height: auto;
}
.next-feed-card {
  flex: 0 0 150px;
  display: grid;
  justify-items: center;
  row-gap: 6px;
  text-align: center;
  border: none;
  outline: none;
  background: transparent;
}
.next-feed-title {
  font-size: 14px;
  font-weight: 600;
  color: #333;
}
.next-feed-gauge {
  width: 100%;
}
.next-feed-gauge svg {
  width: 100%;
  height: auto;
}
.section-header {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 12px;
}
.section-icon {
  width: 36px;
  height: 36px;
  border-radius: 12px;
  background: #EEF1F6;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #4A5568;
}
.section-icon svg {
  width: 20px;
  height: 20px;
  stroke: #4A5568;
  stroke-width: 1.8;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.section-title {
  font-size: 16px;
  font-weight: 600;
  color: #222;
}
.section-subtitle {
  font-size: 12px;
  color: #9099A6;
  margin-top: 2px;
}
.hero-header {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  margin-bottom: 18px;
}
.app-illustration svg {
  width: 65px;
  height: auto;
  display: block;
  transform: translateY(-6px);
  filter: drop-shadow(0 16px 28px rgba(17, 24, 39, 0.2));
}
.hero-bubble {
  animation: hero-bubble-rise 2.4s ease-in-out infinite;
  transform-box: fill-box;
}
.hero-bubble-1 { animation-delay: 0s; }
.hero-bubble-2 { animation-delay: 0.4s; }
.hero-bubble-3 { animation-delay: 0.8s; }
@keyframes hero-bubble-rise {
  0% { transform: translateY(0px); opacity: 0.9; }
  50% { transform: translateY(-6px); opacity: 0.55; }
  100% { transform: translateY(0px); opacity: 0.9; }
}
.hero-svg-fish {
  animation: hero-fish-bob 4.5s ease-in-out infinite;
  transform-origin: 32px 42px;
  transform-box: fill-box;
}
@keyframes hero-fish-bob {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-3.5px); }
}
.app-heading {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
}
.app-title {
  font-size: 24px;
  font-weight: 700;
  color: #1f2937;
  letter-spacing: 0.4px;
}
.app-subtitle {
  font-size: 13px;
  color: #6b7280;
  letter-spacing: 0.3px;
}
.bottom-tabs {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  display: flex;
  background: rgba(255,255,255,0.96);
  box-shadow: 0 -6px 18px rgba(0, 0, 0, 0.15);
  z-index: 1000;
  border-top: 1px solid rgba(15, 23, 42, 0.08);
  padding: 10px 12px;
  border-radius: 16px 16px 0 0;
  backdrop-filter: blur(10px);
}
.bottom-tab {
  flex: 1;
  padding: 10px 8px;
  text-align: center;
  text-decoration: none;
  color: #4b5563;
  font-size: 12px;
  font-weight: 500;
  transition: all 0.2s ease;
  border: none;
  background: transparent;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  border-radius: 12px;
  margin: 0 6px;
}
.bottom-tab:hover {
  background: rgba(15, 23, 42, 0.06);
}
.bottom-tab.active {
  color: #111827;
  background: rgba(15, 23, 42, 0.1);
}
.bottom-tab-icon {
  font-size: 22px;
  line-height: 1;
  color: inherit;
  display: inline-flex;
}
.bottom-tab-icon-svg {
  width: 22px;
  height: 22px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.9;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.bottom-tab-icon-svg .filled {
  fill: currentColor;
  stroke: none;
}
.bottom-tab.active .bottom-tab-icon,
.bottom-tab.active .home-icon {
  color: #111827;
}
.feed-block {
  padding: 8px;
  background: rgba(0,0,0,0.03);
  border-radius: 6px;
  margin-bottom: 8px;
}
.remove-btn {
  background: #f44336;
  color: white;
  border: none;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  cursor: pointer;
  font-size: 18px;
  line-height: 1;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-left: auto;
  transition: background 0.2s ease;
}
.remove-btn:hover {
  background: #d32f2f;
}
.toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: #111;
  color: #fff;
  padding: 14px 26px;
  border-radius: 999px;
  box-shadow: 0 18px 34px rgba(0,0,0,0.22);
  font-weight: 600;
  font-size: 14px;
  letter-spacing: 0.3px;
  z-index: 1000;
  opacity: 0;
  transform-origin: center;
  transform: translate(-50%, -10px);
  transition: opacity 0.25s ease, transform 0.25s ease;
  pointer-events: none;
}
.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}
</style>
</head>
<body>
<div id="toast" class="toast">Saved</div>
<div class="hero-header">
  <div class="app-illustration">
    <svg class="hero-svg-fish" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stylized fish">
      <path d="M58.7 41.5c0-3.5 4.9-11.4 2.6-13.8c-2.5-2.6-8.3 8.5-11.2 8.5c-3.5 0-5.6-4.3-7.3-6.1c-1.4-1.4 2.6-7 .8-7.4c-7.5-1.8-8.5 2.6-12.6 1.5c-3.2-.8-6.5-1.3-9.7-1.3c-12 0-14.3 8.6-16.4 16.6C4.5 40.7 16.6 51 16.6 51s-9.2-5.2-9-4c1.5 6.6 7.7 10.8 14.7 12.4c2 .5 4.1.7 6.1.7c12.8 0 14.8-9.9 21.7-11.1c4.2-.7 8.7 7.4 11.1 4.9c2.6-2.6-2.5-8.3-2.5-12.4" fill="#728389"/>
      <g fill="#8d9ba3">
        <path d="M48.1 60.5c-1.2 1.2-3.6 2.7-6.2 0s-5.4-7.5-4.2-8.7c1.2-1.2 5.8 1.7 8.4 4.4c2.6 2.6 3.2 3.1 2 4.3"/>
        <ellipse cx="33.4" cy="35.3" rx="2.2" ry="3.2"/>
        <ellipse cx="37.6" cy="39.2" rx="1.2" ry="2.5"/>
        <ellipse cx="39.9" cy="36" rx=".6" ry="1.7"/>
      </g>
      <g fill="#75d6ff">
        <ellipse class="hero-bubble hero-bubble-1" cx="5.3" cy="44" rx="1.7" ry="1.8"/>
        <ellipse class="hero-bubble hero-bubble-2" cx="6.3" cy="23.4" rx="4.3" ry="4.5"/>
        <ellipse class="hero-bubble hero-bubble-3" cx="12.8" cy="10.3" rx="8" ry="8.3"/>
      </g>
      <ellipse cx="18.7" cy="38.5" rx="7.1" ry="7.4" fill="#fcfcfa"/>
      <ellipse cx="18.7" cy="38.5" rx="4.9" ry="5.1" fill="#29251c"/>
    </svg>
  </div>
  <div class="app-heading">
    <div class="app-title">AquaFeed Control</div>
    <div class="app-subtitle">Smart feeder</div>
  </div>
</div>

<div class="card battery-card" style="margin-top: 0;">
  <div class="battery-info-row">
    <div class="battery-gauge-wrapper">
      <svg id="batteryGauge" class="battery-gauge-svg" viewBox="0 0 260 160">
        <path id="gaugeBg" d="M 20 140 A 110 110 0 0 1 240 140"
              fill="none" stroke="#E6E9EF" stroke-width="14" stroke-linecap="round"/>
        <path id="gaugeFill" d="M 20 140 A 110 110 0 0 1 240 140"
              fill="none" stroke="#FF5E5E" stroke-width="14" stroke-linecap="round"
              stroke-dasharray="345.58" stroke-dashoffset="86.4" style="transition: stroke-dashoffset 0.6s ease, stroke 0.3s ease;"/>
        <text id="batteryPercent" x="130" y="130" text-anchor="middle" dominant-baseline="middle"
              font-size="28" font-weight="700" fill="#222">75%</text>
      </svg>
      <div class="battery-title">Battery status</div>
      <div class="battery-subtitle">Voltage: 7.85 V</div>
    </div>
    <div class="next-feed-card">
      <div class="next-feed-gauge">
        <svg id="nextFeedGauge" viewBox="0 0 260 160">
          <path id="nextFeedBg" d="M 20 140 A 110 110 0 0 1 240 140"
                fill="none" stroke="#E6E9EF" stroke-width="14" stroke-linecap="round"/>
          <path id="nextFeedFill" d="M 20 140 A 110 110 0 0 1 240 140"
                fill="none" stroke="#1976D2" stroke-width="14" stroke-linecap="round"
                stroke-dasharray="345.58" stroke-dashoffset="173" style="transition: stroke-dashoffset 0.6s ease, stroke 0.3s ease;"/>
          <text id="nextFeedPercent" x="130" y="130" text-anchor="middle" dominant-baseline="middle"
                font-size="28" font-weight="600" fill="#1976D2">2 h 30 m</text>
        </svg>
      </div>
      <div class="next-feed-title">Until next feeding</div>
    </div>
  </div>
</div>

<div class="card">
  <div class="section-header">
    <div class="section-icon">
      <svg viewBox="0 0 24 24">
        <line x1="8" y1="5" x2="8" y2="19"></line>
        <line x1="16" y1="5" x2="16" y2="19"></line>
        <circle cx="8" cy="10" r="2.5"></circle>
        <circle cx="16" cy="14" r="2.5"></circle>
      </svg>
    </div>
    <div>
      <div class="section-title">Manual control</div>
      <div class="section-subtitle">Control the servo manually</div>
    </div>
  </div>
  <div class="row">
    <label>Servo angle: <span id="angleLabel">0</span>°</label>
    <input id="angleSlider" type="range" min="0" max="180" value="0">
  </div>
  <div class="row">
    <label>Servo speed: <span id="speedValue">20</span></label>
    <input id="speedSlider" type="range" min="1" max="20" step="0.1" value="20">
  </div>
  <button onclick="saveSpeed()">Save speed</button>
</div>

<div class="card">
  <div class="section-header">
    <div class="section-icon">
      <svg viewBox="0 0 24 24">
        <path d="M5 11h14"></path>
        <path d="M7 11v2a5 5 0 0 0 10 0v-2"></path>
        <path d="M9 6.5l1.2 3"></path>
        <path d="M15 6.5l-1.2 3"></path>
      </svg>
    </div>
    <div>
      <div class="section-title">Manual feeding</div>
      <div class="section-subtitle">Quick feed cycle start</div>
    </div>
  </div>
  <div class="flex-row">
    <span>Repeats</span>
    <input id="feedRepeats" type="number" min="1" max="20" value="1">
  </div>
  <button onclick="saveRepeats()" style="margin-top: 0;">Save</button>
  <button onclick="feedNow()" style="margin-top: 12px; background: linear-gradient(45deg, #f44336, #d32f2f);">Feed now</button>
</div>

<div class="card">
  <div class="section-header">
    <div class="section-icon">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="7"></circle>
        <line x1="12" y1="12" x2="12" y2="7.5"></line>
        <line x1="12" y1="12" x2="15.5" y2="13.5"></line>
        <path d="M4.5 5.5l1.5 1.5"></path>
        <path d="M19.5 5.5l-1.5 1.5"></path>
      </svg>
    </div>
    <div>
      <div class="section-title">Automatic feeding</div>
      <div class="section-subtitle">Set your feeding schedule</div>
      <div class="section-subtitle" id="localTimeLabel">Time: 14:30</div>
    </div>
  </div>
  <div id="feedTimesContainer">
    <!-- Blocks are added dynamically -->
  </div>
  <button class="add-btn" onclick="addFeedTime()">+ Add feeding</button>
  <button onclick="saveFeedTimes()" style="margin-top: 8px;">Save all times</button>
</div>

<div class="bottom-tabs">
  <a href="preview_index.html" class="bottom-tab active">
    <svg class="bottom-tab-icon home-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M10 20V14H14V20H19V12H22L12 3L2 12H5V20H10Z" fill="currentColor"/>
    </svg>
    <span>Home</span>
  </a>
  <a href="preview_info.html" class="bottom-tab">
    <svg class="bottom-tab-icon bottom-tab-icon-svg" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10" stroke="currentColor" fill="none" stroke-width="2"/>
      <path d="M12 16v-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <circle cx="12" cy="8" r="1" fill="currentColor"/>
    </svg>
    <span>Info</span>
  </a>
  <a href="preview_wifi.html" class="bottom-tab">
    <svg class="bottom-tab-icon bottom-tab-icon-svg wifi-icon" viewBox="0 0 24 24">
      <path d="M2.5 9.2C7.03 4.66 16.97 4.66 21.5 9.2" />
      <path d="M5.8 12.5C9.12 9.19 14.88 9.19 18.2 12.5" />
      <path d="M9.4 15.9C11.15 14.15 12.85 14.15 14.6 15.9" />
      <circle class="filled" cx="12" cy="19.2" r="1.2" />
    </svg>
    <span>Settings</span>
  </a>
</div>

<script>
function showToast(text = 'Saved') {
  const toast = document.getElementById('toast');
  if (toast) {
    toast.innerText = text;
    toast.classList.add('show');
    setTimeout(() => {
      toast.classList.remove('show');
    }, 2000);
  }
}

let feedTimeCounter = 0;

function addFeedTime(hour = 10, minute = 0, repeats = 1, showNotification = true) {
  const container = document.getElementById('feedTimesContainer');
  if (!container) {
    console.error('feedTimesContainer not found');
    return;
  }
  const blockId = 'feedBlock_' + feedTimeCounter++;
  const block = document.createElement('div');
  block.className = 'feed-block';
  block.id = blockId;
  block.innerHTML = `
    <div class="flex-row">
      <span>Time:</span>
      <input type="number" class="feed-hour" min="0" max="23" value="${hour}" style="width:30px; min-width:20px; padding: 4px;">
      <span>:</span>
      <input type="number" class="feed-minute" min="0" max="59" value="${minute}" style="width:30px; min-width:20px; padding: 4px;">
      <span>Repeats:</span>
      <input type="number" class="feed-repeats" min="1" max="20" value="${repeats}" style="width:30px; min-width:20px; padding: 4px;">
      <button class="remove-btn" onclick="removeFeedTime('${blockId}')" title="Remove">×</button>
    </div>
  `;
  container.appendChild(block);
  if (showNotification) {
    showToast('Feeding added');
  }
}

function removeFeedTime(blockId) {
  const block = document.getElementById(blockId);
  if (block) {
    block.remove();
    showToast('Feeding removed');
  }
}

function saveFeedTimes(){
  const blocks = document.querySelectorAll('.feed-block');
  const feedTimes = [];
  blocks.forEach(block => {
    const hour = block.querySelector('.feed-hour').value;
    const minute = block.querySelector('.feed-minute').value;
    const repeats = block.querySelector('.feed-repeats').value;
    feedTimes.push({h: hour, m: minute, r: repeats});
  });
  console.log('Saved feeding times:', feedTimes);
  console.log('JSON payload:', JSON.stringify(feedTimes));
  // On a real ESP32 this will be: fetch('/api/setFeedTimes?data=' + encodeURIComponent(JSON.stringify(feedTimes)))
  showToast('Times saved');
}

function loadFeedTimes(feedTimes) {
  const container = document.getElementById('feedTimesContainer');
  if (!container) return;
  container.innerHTML = '';
  feedTimeCounter = 0; // Reset counter
  if (feedTimes && feedTimes.length > 0) {
    feedTimes.forEach(ft => {
      addFeedTime(ft.h || ft.hour || 10, ft.m || ft.minute || 0, ft.r || ft.repeats || 1, false);
    });
  } else {
    // If no feedings are saved, add one default entry
    addFeedTime(10, 0, 1, false);
  }
}

// Servo angle change handler
const angleSlider = document.getElementById('angleSlider');
if (angleSlider) {
  angleSlider.addEventListener('input', function(){
    const val = this.value;
    const angleLabel = document.getElementById('angleLabel');
    if (angleLabel) {
      angleLabel.innerText = val;
    }
    // Show toast on angle change
    showToast('Angle updated');
  });
}

// Button handlers
function saveSpeed() {
  const s = document.getElementById('speedSlider').value;
  const speedValue = document.getElementById('speedValue');
  if (speedValue) {
    speedValue.innerText = s;
  }
  showToast('Speed saved');
}

function saveRepeats() {
  const r = document.getElementById('feedRepeats').value;
  showToast('Saved');
}

function feedNow() {
  showToast('Feeding');
}

// Initialize one default feeding on load
window.onload = function() {
  loadFeedTimes([]);
};
</script>
</body>
</html>
