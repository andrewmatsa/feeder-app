<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AquaFeed Control</title>
<style>
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  padding: 8px;
  padding-bottom: calc(75px + env(safe-area-inset-bottom, 0px));
  max-width: 100%;
  margin: auto;
  background: #F5F5F5;
  min-height: 100vh;
  color: #333;
  font-size: 14px;
}
.row {margin-bottom: 8px;}
label {display: block; font-weight: 600; margin-bottom: 4px; color: #2c3e50; font-size: 13px;}
input[type=range], select {width: 95%; padding: 6px; border-radius: 6px; border: 1px solid #ddd; font-size: 13px;}
input[type=number] {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #d5d9e0;
  background: #f9fafc;
  font-size: 13px;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
  box-sizing: border-box;
}
input[type=number]:focus {
  outline: none;
  border-color: #1976D2;
  box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.15);
}
.flex-row {
  display: flex;
  gap: 4px;
  align-items: center;
  margin-bottom: 6px;
  flex-wrap: wrap;
}
.flex-row span {font-weight: 500; color: #555; font-size: 13px;}
.flex-row input, .flex-row select {width: auto; min-width: 20px; font-size: 12px;}
.feed-block .feed-row {
  display: grid;
  grid-template-columns: 72px 1fr auto;
  gap: 6px 12px;
  align-items: center;
  width: 100%;
  margin-bottom: 0;
}
.feed-time-wrap {
  grid-column: 1;
  grid-row: 1 / span 2;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  justify-self: start;
}
.feed-block .feed-time {
  width: 66px;
  min-width: 66px;
  font-size: 13px;
  font-weight: 700;
  padding: 3px 5px;
  border: 1px solid #d5d9e0;
  border-radius: 6px;
  background: #f9fafc;
  color: #1f2937;
}
.feed-center {
  grid-column: 2;
  grid-row: 1 / span 2;
  display: flex;
  flex-direction: column;
  gap: 4px;
  align-items: center;
  justify-self: center;
}
.feed-field {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  justify-content: center;
}
.feed-field > span {
  font-size: 13px;
  color: #6b7280;
  min-width: 0;
}
.feed-block .feed-repeats {
  display: none;
}
.feed-block .feed-day {
  width: 90px;
  min-width: 90px;
  font-size: 13px;
  padding: 2px 4px;
}
.feed-repeats-stepper {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.feed-repeats-value {
  min-width: 18px;
  text-align: center;
  font-size: 13px;
  font-weight: 700;
  color: #111827;
}
.feed-repeats-stepper .repeats-stepper-btn {
  width: 30px;
  height: 30px;
  font-size: 13px;
}
.feed-right {
  grid-column: 3;
  grid-row: 1 / span 2;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  justify-self: end;
}
.repeats-stepper {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-left: auto;
}
.repeats-stepper-btn {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 1px solid #d1d5db;
  background: #fff;
  color: #111827;
  font-size: 13px;
  font-weight: 700;
  line-height: 1;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}
.repeats-stepper-btn:active {
  transform: scale(0.96);
}
#feedRepeatsValue {
  min-width: 22px;
  text-align: center;
  font-size: 13px;
  font-weight: 700;
  color: #111827;
}
button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 12px 24px;
  font-size: 13px;
  margin-top: 4px;
  width: 100%;
  border: none;
  border-radius: 999px;
  background: #111;
  color: #fff;
  font-weight: 600;
  letter-spacing: 0.2px;
  cursor: pointer;
  transition: transform 0.15s ease, background 0.2s ease;
}
button:hover {
  transform: translateY(-1px);
  box-shadow: 0 14px 22px rgba(0,0,0,0.2);
}
button:active {
  transform: translateY(0);
  box-shadow: 0 6px 14px rgba(0,0,0,0.16);
}
button.add-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: #fff;
  color: #333;
  border: 1px solid rgba(15, 23, 42, 0.12);
  box-shadow: none;
  width: auto;
  padding: 10px 22px;
  margin: 8px 0;
  transition: background 0.2s ease, color 0.2s ease;
}
button.add-btn:hover {
  background: rgba(15, 23, 42, 0.08);
  color: #111;
}
.card {
  padding: 16px;
  border-radius: 12px;
  background: #FFFFFF;
  margin-bottom: 12px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
}
.battery-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  text-align: center;
  padding: 20px;
}
.battery-info-row {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  gap: 20px;
  width: 100%;
}
.battery-gauge-wrapper {
  position: relative;
  flex: 0 0 150px;
  max-width: 150px;
  margin: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
.battery-title {
  font-size: 14px;
  font-weight: 600;
  color: #222;
}
.battery-subtitle {
  font-size: 13px;
  color: #888;
}
.low-battery-alert {
  width: 100%;
  margin-top: 10px;
  display: none;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid rgba(198, 40, 40, 0.35);
  background: rgba(211, 47, 47, 0.12);
  color: #b71c1c;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.15px;
}
.low-battery-alert.is-low {
  border: 1px solid rgba(198, 40, 40, 0.35);
  background: rgba(211, 47, 47, 0.12);
  color: #b71c1c;
}
.low-battery-alert.is-low .low-battery-alert-icon {
  background: #d32f2f;
  color: #fff;
}
.low-battery-alert.is-charging {
  border: 1px solid rgba(46, 125, 50, 0.35);
  background: rgba(76, 175, 80, 0.14);
  color: #1b5e20;
}
.low-battery-alert.is-charging .low-battery-alert-icon {
  background: #2e7d32;
  color: #fff;
}
.low-battery-alert.is-visible {
  display: inline-flex;
}
.low-battery-alert-icon {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: #d32f2f;
  color: #fff;
  font-size: 12px;
  font-weight: 800;
  line-height: 1;
  overflow: hidden;
  flex-shrink: 0;
  font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
}
.battery-gauge-svg {
  width: 100%;
  height: auto;
}
@keyframes gauge-charge-fill {
  0%   { stroke-dashoffset: var(--charge-full, 345.58); }
  62%  { stroke-dashoffset: var(--charge-target, 0); }
  80%  { stroke-dashoffset: var(--charge-target, 0); }
  100% { stroke-dashoffset: var(--charge-full, 345.58); }
}
.battery-gauge-charging {
  animation: gauge-charge-fill 2.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  transition: none !important;
}
.next-feed-card {
  flex: 0 0 150px;
  display: grid;
  justify-items: center;
  row-gap: 6px;
  text-align: center;
  border: none;
  outline: none;
  background: transparent;
}
.next-feed-title {
  font-size: 14px;
  font-weight: 600;
  color: #333;
}
.next-feed-gauge {
  width: 100%;
}
.next-feed-gauge svg {
  width: 100%;
  height: auto;
}
.section-header {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 12px;
}
.section-icon {
  width: 36px;
  height: 36px;
  border-radius: 12px;
  background: #EEF1F6;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #4A5568;
}
.section-icon svg {
  width: 20px;
  height: 20px;
  stroke: #4A5568;
  stroke-width: 1.8;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.section-title {
  font-size: 16px;
  font-weight: 600;
  color: #222;
}
.section-subtitle {
  font-size: 13px;
  color: #9099A6;
  margin-top: 2px;
}
.hero-header {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  margin-bottom: 18px;
}
.app-illustration svg {
  width: 65px;
  height: auto;
  display: block;
  transform: translateY(-6px);
  filter: drop-shadow(0 16px 28px rgba(17, 24, 39, 0.2));
}
.hero-bubble {
  animation: hero-bubble-rise 2.4s ease-in-out infinite;
  transform-box: fill-box;
}
.hero-bubble-1 { animation-delay: 0s; }
.hero-bubble-2 { animation-delay: 0.4s; }
.hero-bubble-3 { animation-delay: 0.8s; }
@keyframes hero-bubble-rise {
  0% { transform: translateY(0px); opacity: 0.9; }
  50% { transform: translateY(-6px); opacity: 0.55; }
  100% { transform: translateY(0px); opacity: 0.9; }
}
.app-illustration {
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.app-illustration.is-escaping {
  animation: hero-fish-escape-left 2.1s cubic-bezier(0.22, 0.7, 0.2, 1) 1;
}
.hero-svg-fish {
  animation: hero-fish-swim 4.2s ease-in-out infinite;
  transform-origin: 32px 42px;
  transform-box: fill-box;
  cursor: pointer;
}
.hero-fish-body {
  animation: hero-fish-body-wave 2.2s ease-in-out infinite;
  transform-origin: 29px 40px;
  transform-box: fill-box;
}
.hero-fish-tail {
  animation: hero-fish-tail-flick 1.25s ease-in-out infinite;
  transform-origin: 38px 56px;
  transform-box: fill-box;
}
.hero-fish-tail.tail-burst {
  animation: hero-fish-tail-burst 0.16s ease-in-out 6;
}
.hero-fish-eye {
  transform-origin: center;
  transform-box: fill-box;
  animation: hero-fish-eye-blink 6s linear infinite;
}
@keyframes hero-fish-swim {
  0%, 100% { transform: translate3d(0px, 0px, 0) rotate(-0.6deg); }
  25% { transform: translate3d(1.8px, -2.4px, 0) rotate(0.5deg); }
  50% { transform: translate3d(3.2px, -0.8px, 0) rotate(0.9deg); }
  75% { transform: translate3d(1px, -3px, 0) rotate(0.1deg); }
}
@keyframes hero-fish-escape-left {
  0% { transform: translate3d(0px, 0px, 0); }
  22% { transform: translate3d(-16px, -1px, 0); }
  48% { transform: translate3d(-42px, -3px, 0); }
  72% { transform: translate3d(-10px, 0px, 0); }
  86% { transform: translate3d(6px, 0px, 0); }
  100% { transform: translate3d(0px, 0px, 0); }
}
@keyframes hero-fish-body-wave {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(1.6deg); }
}
@keyframes hero-fish-tail-flick {
  0%, 100% { transform: rotate(0deg); }
  35% { transform: rotate(-5deg); }
  65% { transform: rotate(4deg); }
}
@keyframes hero-fish-tail-burst {
  0% { transform: rotate(0deg); }
  50% { transform: rotate(-16deg); }
  100% { transform: rotate(14deg); }
}
@keyframes hero-fish-eye-blink {
  0%, 47%, 49%, 100% { transform: scaleY(1); }
  48% { transform: scaleY(0.15); }
}
.app-heading {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
}
.app-title {
  font-size: 24px;
  font-weight: 700;
  color: #1f2937;
  letter-spacing: 0.4px;
}
.app-subtitle {
  font-size: 13px;
  color: #6b7280;
  letter-spacing: 0.3px;
}
.bottom-tabs {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  display: flex;
  background: rgba(255,255,255,0.96);
  box-shadow: 0 -6px 18px rgba(0, 0, 0, 0.15);
  z-index: 1020;
  border-top: 1px solid rgba(15, 23, 42, 0.08);
  padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
  border-radius: 16px 16px 0 0;
  backdrop-filter: blur(10px);
}
.bottom-tab {
  flex: 1;
  padding: 10px 8px;
  text-align: center;
  text-decoration: none;
  color: #4b5563;
  font-size: 12px;
  font-weight: 500;
  transition: all 0.2s ease;
  border: none;
  background: transparent;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  border-radius: 12px;
  margin: 0 6px;
}
.bottom-tab:hover {
  background: rgba(15, 23, 42, 0.06);
}
.bottom-tab.active {
  color: #111827;
  background: rgba(15, 23, 42, 0.1);
}
.bottom-tab-icon {
  font-size: 22px;
  line-height: 1;
  color: inherit;
  display: inline-flex;
}
.bottom-tab-icon-svg {
  width: 22px;
  height: 22px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.9;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.bottom-tab-icon-svg .filled {
  fill: currentColor;
  stroke: none;
}
.bottom-tab.active .bottom-tab-icon,
.bottom-tab.active .home-icon {
  color: #111827;
}
.feed-block {
  padding: 7px 10px;
  background: rgba(0,0,0,0.03);
  border-radius: 6px;
  margin-bottom: 6px;
  border-left: 3px solid #8e24aa;
}
.remove-btn {
  background: #f44336;
  color: white;
  border: none;
  border-radius: 50%;
  width: 22px;
  height: 22px;
  cursor: pointer;
  font-size: 15px;
  line-height: 1;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-left: 0;
  transition: background 0.2s ease;
}
.remove-btn:hover {
  background: #d32f2f;
}
.toast {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  background: linear-gradient(180deg, rgba(15,23,42,0.58), rgba(15,23,42,0.42));
  color: rgba(248,250,252,0.96);
  padding: 12px 16px;
  border-radius: 0 0 12px 12px;
  border-bottom: 1px solid rgba(255,255,255,0.18);
  box-shadow: 0 10px 26px rgba(0,0,0,0.16);
  backdrop-filter: blur(10px) saturate(125%);
  -webkit-backdrop-filter: blur(10px) saturate(125%);
  font-weight: 600;
  font-size: 14px;
  letter-spacing: 0.3px;
  text-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  z-index: 1100;
  opacity: 0;
  transform: translateY(-14px) scale(0.985);
  transition: opacity 0.42s cubic-bezier(0.22, 1, 0.36, 1), transform 0.42s cubic-bezier(0.22, 1, 0.36, 1);
  pointer-events: none;
}
.toast-icon {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,0.2);
  border: 1px solid rgba(255,255,255,0.35);
  font-size: 12px;
  font-weight: 700;
  line-height: 1;
  flex: 0 0 auto;
}
.toast-text {
  display: inline-block;
}
.toast.show {
  opacity: 1;
  transform: translateY(0) scale(1);
}
#btnFeedNow {
  position: relative;
  overflow: hidden;
  margin-top: 14px;
  padding: 14px 24px;
  font-size: 15px;
  font-weight: 700;
  border-radius: 14px;
  background: linear-gradient(45deg, #f44336, #d32f2f);
  box-shadow: 0 10px 22px rgba(211, 47, 47, 0.28);
  transition: transform 0.18s ease, box-shadow 0.25s ease, opacity 0.2s ease;
}
#btnFeedNow:not(:disabled):hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 24px rgba(211, 47, 47, 0.34);
}
#btnFeedNow.is-feeding {
  animation: feedNowPulse 1.1s ease-in-out infinite;
}
#btnFeedNow.is-feeding::after {
  content: '';
  position: absolute;
  top: 0;
  left: -45%;
  width: 45%;
  height: 100%;
  background: linear-gradient(105deg, rgba(255,255,255,0), rgba(255,255,255,0.28), rgba(255,255,255,0));
  animation: feedNowSweep 0.95s linear infinite;
}
@keyframes feedNowPulse {
  0% { box-shadow: 0 0 0 0 rgba(244,67,54,0.35); }
  70% { box-shadow: 0 0 0 10px rgba(244,67,54,0); }
  100% { box-shadow: 0 0 0 0 rgba(244,67,54,0); }
}
@keyframes feedNowSweep {
  from { left: -45%; }
  to { left: 115%; }
}
.preview-lang-hint {
  font-size: 11px;
  color: #6b7280;
  margin: 0 8px 12px;
  line-height: 1.45;
}
.preview-lang-hint code { font-size: 10px; background: #eee; padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>
<div id="toast" class="toast">
  <span class="toast-icon" aria-hidden="true">i</span>
  <span id="toastText" class="toast-text">Saved</span>
</div>
<div class="hero-header">
  <div class="app-illustration">
    <svg class="hero-svg-fish" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stylized fish">
      <path class="hero-fish-body" d="M58.7 41.5c0-3.5 4.9-11.4 2.6-13.8c-2.5-2.6-8.3 8.5-11.2 8.5c-3.5 0-5.6-4.3-7.3-6.1c-1.4-1.4 2.6-7 .8-7.4c-7.5-1.8-8.5 2.6-12.6 1.5c-3.2-.8-6.5-1.3-9.7-1.3c-12 0-14.3 8.6-16.4 16.6C4.5 40.7 16.6 51 16.6 51s-9.2-5.2-9-4c1.5 6.6 7.7 10.8 14.7 12.4c2 .5 4.1.7 6.1.7c12.8 0 14.8-9.9 21.7-11.1c4.2-.7 8.7 7.4 11.1 4.9c2.6-2.6-2.5-8.3-2.5-12.4" fill="#728389"/>
      <g fill="#8d9ba3">
        <path class="hero-fish-tail" d="M48.1 60.5c-1.2 1.2-3.6 2.7-6.2 0s-5.4-7.5-4.2-8.7c1.2-1.2 5.8 1.7 8.4 4.4c2.6 2.6 3.2 3.1 2 4.3"/>
        <ellipse cx="33.4" cy="35.3" rx="2.2" ry="3.2"/>
        <ellipse cx="37.6" cy="39.2" rx="1.2" ry="2.5"/>
        <ellipse cx="39.9" cy="36" rx=".6" ry="1.7"/>
      </g>
      <g fill="#75d6ff">
        <ellipse class="hero-bubble hero-bubble-1" cx="5.3" cy="44" rx="1.7" ry="1.8"/>
        <ellipse class="hero-bubble hero-bubble-2" cx="6.3" cy="23.4" rx="4.3" ry="4.5"/>
        <ellipse class="hero-bubble hero-bubble-3" cx="12.8" cy="10.3" rx="8" ry="8.3"/>
      </g>
      <ellipse cx="18.7" cy="38.5" rx="7.1" ry="7.4" fill="#fcfcfa"/>
      <ellipse class="hero-fish-eye" cx="18.7" cy="38.5" rx="4.9" ry="5.1" fill="#29251c"/>
    </svg>
  </div>
  <div class="app-heading">
    <div class="app-title">AquaFeed Control</div>
    <div class="app-subtitle">Smart feeder</div>
  </div>
</div>

<div id="deepSleepHelpBanner" class="card" style="margin-top: 0; padding: 10px 14px; background: #f0f7ff; border: 1px solid #c5d9f0; font-size: 13px; color: #374151; line-height: 1.4;"></div>

<div class="card battery-card" style="margin-top: 0;">
  <div class="battery-info-row">
    <div class="battery-gauge-wrapper">
      <svg id="batteryGauge" class="battery-gauge-svg" viewBox="0 0 260 160">
        <path id="gaugeBg" d="M 20 140 A 110 110 0 0 1 240 140"
              fill="none" stroke="#E6E9EF" stroke-width="14" stroke-linecap="round"/>
        <path id="gaugeFill" d="M 20 140 A 110 110 0 0 1 240 140"
              fill="none" stroke="#FF5E5E" stroke-width="14" stroke-linecap="round"
              stroke-dasharray="345.58" stroke-dashoffset="86.4" style="transition: stroke-dashoffset 0.6s ease, stroke 0.3s ease;"/>
        <text id="batteryPercent" x="130" y="130" text-anchor="middle" dominant-baseline="middle"
              font-size="28" font-weight="700" fill="#222">75%</text>
      </svg>
      <div class="battery-title">Battery status</div>
      <div class="battery-subtitle">Voltage: 7.85 V</div>
    </div>

let currentLang = localStorage.getItem('aqua_lang') || 'uk';
function t(key) {
  return (I18N[currentLang] && I18N[currentLang][key]) || (I18N.uk[key] || key);
}
const LOW_BATTERY_ALERT_THRESHOLD = 20;
let previewChargingNow = false;

function getPreviewBatteryPercent() {
  const percentEl = document.getElementById('batteryPercent');
  if (!percentEl) return null;
  const parsed = Number(String(percentEl.textContent || '').replace('%', '').trim());
  return Number.isFinite(parsed) ? parsed : null;
}

function updateLowBatteryAlert(percent, isCharging = false) {
  const alertEl = document.getElementById('lowBatteryAlert');
  const textEl = document.getElementById('lowBatteryAlertText');
  const iconEl = alertEl ? alertEl.querySelector('.low-battery-alert-icon') : null;
  if (!alertEl) return;
  if (isCharging) {
    if (textEl) textEl.textContent = t('chargingNow');
    if (iconEl) iconEl.textContent = 'i';
    alertEl.classList.remove('is-low');
    alertEl.classList.add('is-charging');
    alertEl.classList.add('is-visible');
    return;
  }
  if (Number.isFinite(percent) && percent <= LOW_BATTERY_ALERT_THRESHOLD) {
    if (textEl) textEl.textContent = t('lowBatteryAlert');
    if (iconEl) iconEl.textContent = '!';
    alertEl.classList.remove('is-charging');
    alertEl.classList.add('is-low');
    alertEl.classList.add('is-visible');
  } else {
    alertEl.classList.remove('is-charging');
    alertEl.classList.remove('is-low');
    alertEl.classList.remove('is-visible');
  }
}

let hasBatteryGaugeIntroAnimated = false;
let hasNextFeedGaugeIntroAnimated = false;

function updateBatteryGauge(percent) {
  const gaugeFill = document.getElementById('gaugeFill');
  const percentLabel = document.getElementById('batteryPercent');
  if (!gaugeFill || !percentLabel) return;

  if (!Number.isFinite(percent)) {
    const circumference = 345.58;
    gaugeFill.classList.remove('battery-gauge-charging');
    gaugeFill.style.transition = '';
    gaugeFill.style.strokeDasharray = circumference;
    gaugeFill.style.strokeDashoffset = circumference;
    gaugeFill.style.stroke = '#E6E9EF';
    percentLabel.textContent = '--%';
    percentLabel.setAttribute('fill', '#6b7280');
    updateLowBatteryAlert(null, previewChargingNow);
    return;
  }

  const safePercent = Math.max(0, Math.min(100, Math.round(percent)));
  const circumference = 345.58;
  const offset = circumference - (safePercent / 100) * circumference;
  gaugeFill.style.strokeDasharray = circumference;

  let color = previewChargingNow ? '#4CAF50' : (safePercent >= 75 ? '#4CAF50' : safePercent >= 35 ? '#FFB300' : '#D32F2F');
  gaugeFill.style.stroke = color;
  percentLabel.setAttribute('fill', color);
  percentLabel.textContent = `${safePercent}%`;

  if (previewChargingNow) {
    gaugeFill.style.setProperty('--charge-full', circumference);
    gaugeFill.style.setProperty('--charge-target', offset);
    gaugeFill.classList.add('battery-gauge-charging');
    hasBatteryGaugeIntroAnimated = true;
  } else {
    gaugeFill.classList.remove('battery-gauge-charging');
    if (!hasBatteryGaugeIntroAnimated) {
      gaugeFill.style.transition = 'none';
      gaugeFill.style.strokeDashoffset = circumference;
      void gaugeFill.getBoundingClientRect();
      gaugeFill.style.transition = 'stroke-dashoffset 1.15s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.3s ease';
      requestAnimationFrame(() => {
        gaugeFill.style.strokeDashoffset = offset;
      });
      hasBatteryGaugeIntroAnimated = true;
    } else {
      gaugeFill.style.transition = 'stroke-dashoffset 0.6s ease, stroke 0.3s ease';
      gaugeFill.style.strokeDashoffset = offset;
    }
  }
  updateLowBatteryAlert(safePercent, previewChargingNow);
}

function animateNextFeedGaugeIntro() {
  const fillPath = document.getElementById('nextFeedFill');
  if (!fillPath || hasNextFeedGaugeIntroAnimated) return;

  const circumference = 345.58;
  const currentOffset = Number(fillPath.style.strokeDashoffset || fillPath.getAttribute('stroke-dashoffset') || circumference);
  const targetOffset = Number.isFinite(currentOffset) ? currentOffset : circumference;

  fillPath.style.strokeDasharray = circumference;
  fillPath.style.transition = 'none';
  fillPath.style.strokeDashoffset = circumference;
  void fillPath.getBoundingClientRect();
  fillPath.style.transition = 'stroke-dashoffset 1.15s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.3s ease';
  requestAnimationFrame(() => {
    fillPath.style.strokeDashoffset = targetOffset;
  });
  hasNextFeedGaugeIntroAnimated = true;
}

const previewSleepState = {
  countdownSeconds: 12,
  reason: 'recent_activity'
};

let heroTailBurstTimer = null;
let heroEscapeTimer = null;

function syncPreviewNextFeedingInlineLabel() {
  const inlineLabelEl = document.getElementById('nextFeedingInlineLabel');
  const gaugeTextEl = document.getElementById('nextFeedPercent');
  if (!inlineLabelEl) return;
  const currentValue = gaugeTextEl && gaugeTextEl.textContent && gaugeTextEl.textContent.trim().length
    ? gaugeTextEl.textContent.trim()
    : t('nextFeedDash');
  inlineLabelEl.textContent = `${t('nextFeedingInlineLabel')} ${currentValue}`;
}

function formatDurationMinutes(minutes) {
  if (!Number.isFinite(minutes) || minutes < 0) return t('nextFeedDash');
  const hours = Math.floor(minutes / 60);
  const mins = minutes % 60;
  return currentLang === 'en' ? `${hours} h ${mins} m` : `${hours} год ${mins} хв`;
}

function collectPreviewScheduleFromDom() {
  const schedule = [];
  document.querySelectorAll('.feed-block').forEach((block) => {
    const timeInput = block.querySelector('.feed-time');
    if (!timeInput) return;
    const parsed = parseFeedTimeValue(timeInput.value);
    const hour = ((parsed.hour % 24) + 24) % 24;
    const minute = ((parsed.minute % 60) + 60) % 60;
    const dayInput = block.querySelector('.feed-day');
    const day = dayInput ? clampFeedValue(dayInput.value, -1, 6, -1) : -1;
    schedule.push({ total: hour * 60 + minute, day });
  });
  return schedule;
}

function updatePreviewNextFeedTime() {
  const gaugeTextEl = document.getElementById('nextFeedPercent');
  if (!gaugeTextEl) return;
  const schedule = collectPreviewScheduleFromDom();
  if (!schedule.length) {
    gaugeTextEl.textContent = t('nextFeedDash');
    syncPreviewNextFeedingInlineLabel();
    return;
  }
  const now = new Date();
  const nowMinutes = now.getHours() * 60 + now.getMinutes();
  const nowDay = now.getDay();
  let minutesUntilNext = Number.POSITIVE_INFINITY;
  schedule.forEach((item) => {
    let dayDelta = 0;
    if (item.day >= 0) {
      dayDelta = (item.day - nowDay + 7) % 7;
    }
    let diff = dayDelta * 24 * 60 + (item.total - nowMinutes);
    if (diff <= 0) {
      diff += item.day >= 0 ? (7 * 24 * 60) : (24 * 60);
    }
    if (diff < minutesUntilNext) minutesUntilNext = diff;
  });
  if (!Number.isFinite(minutesUntilNext)) {
    minutesUntilNext = 0;
  }
  gaugeTextEl.textContent = formatDurationMinutes(minutesUntilNext);
  syncPreviewNextFeedingInlineLabel();
}

function initHeroFishTailBurst() {
  const fish = document.querySelector('.hero-svg-fish');
  const tail = document.querySelector('.hero-fish-tail');
  const illustration = fish ? fish.closest('.app-illustration') : null;
  if (!fish || !tail || !illustration || fish.dataset.tailBurstReady === '1') return;
  fish.dataset.tailBurstReady = '1';

  fish.addEventListener('click', function() {
    if (illustration.classList.contains('is-escaping')) return;
    illustration.classList.add('is-escaping');
    tail.classList.remove('tail-burst');
    void tail.offsetWidth;
    tail.classList.add('tail-burst');
    if (heroTailBurstTimer) clearTimeout(heroTailBurstTimer);
    heroTailBurstTimer = setTimeout(function() {
      tail.classList.remove('tail-burst');
      heroTailBurstTimer = null;
    }, 950);
    if (heroEscapeTimer) clearTimeout(heroEscapeTimer);
    heroEscapeTimer = setTimeout(function() {
      illustration.classList.remove('is-escaping');
      heroEscapeTimer = null;
    }, 2150);
  });
}

/** Demo: seconds until manual feed allowed (0 = ready). */
const previewManualFeedCooldownSeconds = 150;

let manualFeedCooldownLocal = 0;
let manualFeedCooldownInterval = null;
let manualFeedInProgress = false;
let manualFeedAnimationTimer = null;

function formatManualFeedCountdown(totalSeconds) {
  const s = Math.max(0, Math.floor(Number(totalSeconds) || 0));
  const mins = Math.floor(s / 60);
  const secs = s % 60;
  if (currentLang === 'en') {
    if (mins > 0) return `${mins}m ${secs}s`;
    return `${secs}s`;
  }
  if (mins > 0) return `${mins} хв ${secs} с`;
  return `${secs} с`;
}

function renderFeedNowButtonState() {
  const btn = document.getElementById('btnFeedNow');
  if (!btn) return;
  const cooldownSec = Math.max(0, Math.floor(Number(manualFeedCooldownLocal) || 0));
  const inCooldown = cooldownSec > 0;
  const isDisabled = manualFeedInProgress || inCooldown;

  btn.disabled = isDisabled;
  btn.style.opacity = isDisabled ? '0.72' : '';
  btn.style.cursor = isDisabled ? 'not-allowed' : '';
  btn.classList.toggle('is-feeding', manualFeedInProgress);

  if (manualFeedInProgress) {
    btn.textContent = t('feedNowInProgress');
  } else if (inCooldown) {
    btn.textContent = `${t('feedNow')} (${formatManualFeedCountdown(cooldownSec)})`;
  } else {
    btn.textContent = t('feedNow');
  }
}

function renderManualFeedHint(seconds) {
  manualFeedCooldownLocal = Math.max(0, Math.floor(Number(seconds) || 0));
  renderFeedNowButtonState();
}

function syncManualFeedCooldownFromStatus(seconds) {
  renderManualFeedHint(seconds);
  if (manualFeedCooldownInterval) {
    clearInterval(manualFeedCooldownInterval);
    manualFeedCooldownInterval = null;
  }
  if (manualFeedCooldownLocal > 0) {
    manualFeedCooldownInterval = setInterval(() => {
      manualFeedCooldownLocal = Math.max(0, manualFeedCooldownLocal - 1);
      renderManualFeedHint(manualFeedCooldownLocal);
      if (manualFeedCooldownLocal <= 0 && manualFeedCooldownInterval) {
        clearInterval(manualFeedCooldownInterval);
        manualFeedCooldownInterval = null;
      }
    }, 1000);
  }
}

function formatSleepCountdown(seconds) {
  if (!Number.isFinite(seconds) || seconds < 0) return t('sleepPaused');
  if (seconds <= 0) return t('sleepNow');
  const mins = Math.floor(seconds / 60);
  const secs = seconds % 60;
  return mins > 0 ? `${mins}m ${secs}s` : `${secs}s`;
}

function getSleepReasonText(reason) {
  switch (reason) {
    case 'ready': return t('sleepReasonReady');
    case 'power_save_off': return t('sleepReasonPowerSaveOff');
    case 'ap_mode': return t('sleepReasonApMode');
    case 'feeding': return t('sleepReasonFeeding');
    case 'web_active': return t('sleepReasonWebActive');
    case 'recent_activity': return t('sleepReasonRecentActivity');
    case 'display_awake': return t('sleepReasonDisplayAwake');
    default: return t('sleepReasonUnknown');
  }
}

function applyPreviewSleepLabels() {
  const sleepCountdownLabel = document.getElementById('sleepCountdownLabel');
  const sleepReasonLabel = document.getElementById('sleepReasonLabel');
  if (sleepCountdownLabel) {
    sleepCountdownLabel.dataset.dynamic = 'true';
    sleepCountdownLabel.textContent = `${t('sleepPrefix')} ${formatSleepCountdown(previewSleepState.countdownSeconds)}`;
  }
  if (sleepReasonLabel) {
    sleepReasonLabel.dataset.dynamic = 'true';
    sleepReasonLabel.textContent = `${t('sleepReasonPrefix')} ${getSleepReasonText(previewSleepState.reason)}`;
  }
}

function applyLanguage() {
  const sections = document.querySelectorAll('.section-title');
  const subtitles = document.querySelectorAll('.section-subtitle');
  const labels = document.querySelectorAll('label');
  const tabs = document.querySelectorAll('.bottom-tab span');
  const appSubtitle = document.querySelector('.app-subtitle');
  const batteryTitle = document.querySelector('.battery-title');
  const batterySubtitle = document.querySelector('.battery-subtitle');
  const nextFeedTitle = document.querySelector('.next-feed-title');
  if (appSubtitle) appSubtitle.textContent = t('appSubtitle');
  if (batteryTitle) batteryTitle.textContent = t('batteryTitle');
  if (batterySubtitle) {
    batterySubtitle.innerHTML = `${t('batteryVoltagePrefix')} 7.85 V`;
  }
  if (nextFeedTitle) nextFeedTitle.textContent = t('nextFeedTitle');
  const lowBatteryAlertText = document.getElementById('lowBatteryAlertText');
  if (lowBatteryAlertText) lowBatteryAlertText.textContent = t('lowBatteryAlert');
  const currentBatteryPercent = getPreviewBatteryPercent();
  updateLowBatteryAlert(currentBatteryPercent, previewChargingNow);
  updateBatteryGauge(getPreviewBatteryPercent());
  const deepSleepBanner = document.getElementById('deepSleepHelpBanner');
  if (deepSleepBanner) deepSleepBanner.innerHTML = t('deepSleepHelpBanner');
  if (sections[0]) sections[0].textContent = t('manualFeedTitle');
  if (subtitles[0]) subtitles[0].textContent = t('manualFeedSubtitle');
  if (sections[1]) sections[1].textContent = t('autoFeedTitle');
  if (subtitles[1]) subtitles[1].textContent = t('autoFeedSubtitle');
  if (sections[2]) sections[2].textContent = t('manualControlTitle');
  if (subtitles[2]) subtitles[2].textContent = t('manualControlSubtitle');
  syncPreviewNextFeedingInlineLabel();
  applyPreviewSleepLabels();
  if (labels[0]) labels[0].innerHTML = `${t('servoAngle')} <span id="angleLabel">0</span>°`;
  if (labels[1]) labels[1].innerHTML = `${t('servoSpeed')} <span id="speedValue">20</span>`;
  var b1 = document.getElementById('btnSaveSpeed');
  var b4 = document.getElementById('btnAddFeeding');
  var b5 = document.getElementById('btnSaveAllTimes');
  if (b1) b1.textContent = t('saveSpeed');
  if (b4) b4.textContent = t('addFeeding');
  if (b5) b5.textContent = t('saveAllTimes');
  renderFeedNowButtonState();
  renderManualFeedHint(manualFeedCooldownLocal);
  const repeatsLabel = document.querySelector('.repeats-label');
  if (repeatsLabel) repeatsLabel.textContent = t('repeats');
  if (tabs[0]) tabs[0].textContent = t('tabHome');
  if (tabs[1]) tabs[1].textContent = t('tabInfo');
  if (tabs[2]) tabs[2].textContent = t('tabSettings');
  document.querySelectorAll('.feed-block .flex-row').forEach(function(row) {
    const timeLabel = row.querySelector('.feed-time-label');
    if (timeLabel) timeLabel.textContent = t('feedTime');
    const repeatsFieldLabel = row.querySelector('.feed-repeats-label');
    if (repeatsFieldLabel) repeatsFieldLabel.textContent = t('feedRepeatsField');
    const dayLabel = row.querySelector('.feed-day-label');
    if (dayLabel) dayLabel.textContent = t('feedDayField');
    const daySelect = row.querySelector('.feed-day');
    if (daySelect) {
      const selectedDay = clampFeedValue(daySelect.value, -1, 6, -1);
      daySelect.innerHTML = renderFeedDayOptions(selectedDay);
    }
    const rm = row.querySelector('.remove-btn');
    if (rm) rm.title = t('removeTitle');
  });
}

let toastHideTimer = null;

function showToast(text) {
  if (text === undefined || text === null) text = t('toastSaved');
  const toast = document.getElementById('toast');
  const toastText = document.getElementById('toastText');
  if (toast) {
    if (toastText) {
      toastText.textContent = text;
    } else {
      toast.textContent = text;
    }
    if (toastHideTimer) {
      clearTimeout(toastHideTimer);
      toastHideTimer = null;
    }
    toast.classList.add('show');
    toastHideTimer = setTimeout(() => {
      toast.classList.remove('show');
      toastHideTimer = null;
    }, 3800);
  }
}

let feedTimeCounter = 0;

function clampFeedValue(value, min, max, fallback) {
  const parsed = parseInt(value, 10);
  if (isNaN(parsed)) return fallback;
  return Math.min(max, Math.max(min, parsed));
}

function readFeedTimeField(item, shortKey, longKey, fallback) {
  if (item && item[shortKey] !== undefined && item[shortKey] !== null) return item[shortKey];
  if (item && item[longKey] !== undefined && item[longKey] !== null) return item[longKey];
  return fallback;
}

function formatFeedTimeValue(hour, minute) {
  return `${String(clampFeedValue(hour, 0, 23, 10)).padStart(2, '0')}:${String(clampFeedValue(minute, 0, 59, 0)).padStart(2, '0')}`;
}

function parseFeedTimeValue(value) {
  const match = /^(\d{1,2}):(\d{1,2})$/.exec(String(value || '').trim());
  if (!match) {
    return { hour: 10, minute: 0 };
  }
  return {
    hour: clampFeedValue(match[1], 0, 23, 10),
    minute: clampFeedValue(match[2], 0, 59, 0),
  };
}

function renderFeedDayOptions(selectedDay = -1) {
  const current = clampFeedValue(selectedDay, -1, 6, -1);
  const options = [
    { value: -1, label: t('dayEveryday') },
    { value: 1, label: t('dayMon') },
    { value: 2, label: t('dayTue') },
    { value: 3, label: t('dayWed') },
    { value: 4, label: t('dayThu') },
    { value: 5, label: t('dayFri') },
    { value: 6, label: t('daySat') },
    { value: 0, label: t('daySun') },
  ];
  return options.map(opt => `<option value="${opt.value}" ${opt.value === current ? 'selected' : ''}>${opt.label}</option>`).join('');
}

function adjustAutoFeedRepeats(blockId, delta) {
  const block = document.getElementById(blockId);
  if (!block) return;
  const repeatsInput = block.querySelector('.feed-repeats');
  const repeatsValueEl = block.querySelector('.feed-repeats-value');
  if (!repeatsInput || !repeatsValueEl) return;
  const current = clampFeedValue(repeatsInput.value, 1, 20, 1);
  const next = clampFeedValue(current + Number(delta || 0), 1, 20, 1);
  repeatsInput.value = String(next);
  repeatsValueEl.textContent = String(next);
}

function addFeedTime(hour = 10, minute = 0, repeats = 1, showNotification = true, day = -1, enabled = true) {
  const container = document.getElementById('feedTimesContainer');
  if (!container) {
    console.error('feedTimesContainer not found');
    return;
  }
  const blockId = 'feedBlock_' + feedTimeCounter++;
  const block = document.createElement('div');
  block.className = 'feed-block';
  block.id = blockId;
  block.innerHTML = `
    <div class="feed-row">
      <div class="feed-time-wrap">
        <span class="feed-time-label" style="display:none">${t('feedTime')}</span>
        <input type="time" class="feed-time" step="60" value="${formatFeedTimeValue(hour, minute)}">
      </div>
      <div class="feed-center">
        <label class="feed-field">
          <span class="feed-repeats-label">${t('feedRepeatsField')}</span>
          <input type="hidden" class="feed-repeats" value="${clampFeedValue(repeats, 1, 20, 1)}">
          <div class="feed-repeats-stepper" role="group" aria-label="${t('feedRepeatsField')}">
            <button type="button" class="repeats-stepper-btn" aria-label="Decrease repeats" onclick="adjustAutoFeedRepeats('${blockId}', -1)">-</button>
            <span class="feed-repeats-value">${clampFeedValue(repeats, 1, 20, 1)}</span>
            <button type="button" class="repeats-stepper-btn" aria-label="Increase repeats" onclick="adjustAutoFeedRepeats('${blockId}', 1)">+</button>
          </div>
        </label>
        <label class="feed-field">
          <span class="feed-day-label">${t('feedDayField')}</span>
          <select class="feed-day">${renderFeedDayOptions(day)}</select>
        </label>
      </div>
      <div class="feed-right">
        <button class="remove-btn" onclick="removeFeedTime('${blockId}')" title="${t('removeTitle')}">×</button>
      </div>
    </div>
  `;
  container.appendChild(block);
  const timeInput = block.querySelector('.feed-time');
  if (timeInput) {
    timeInput.addEventListener('input', updatePreviewNextFeedTime);
    timeInput.addEventListener('change', updatePreviewNextFeedTime);
  }
  const dayInput = block.querySelector('.feed-day');
  if (dayInput) {
    dayInput.addEventListener('change', updatePreviewNextFeedTime);
  }
  updatePreviewNextFeedTime();
  if (showNotification) {
    showToast(t('toastFeedingAdded'));
  }
}

function removeFeedTime(blockId) {
  const block = document.getElementById(blockId);
  if (block) {
    block.remove();
    updatePreviewNextFeedTime();
    showToast(t('toastFeedingRemoved'));
  }
}

function saveFeedTimes(){
  const blocks = document.querySelectorAll('.feed-block');
  const feedTimes = [];
  blocks.forEach(block => {
    const timeValue = block.querySelector('.feed-time').value;
    const { hour, minute } = parseFeedTimeValue(timeValue);
    const repeats = clampFeedValue(block.querySelector('.feed-repeats').value, 1, 20, 1);
    const dayInput = block.querySelector('.feed-day');
    const day = dayInput ? clampFeedValue(dayInput.value, -1, 6, -1) : -1;
    feedTimes.push({ hour, minute, repeats, day, enabled: true });
  });
  console.log('Saved feeding times:', feedTimes);
  console.log('JSON payload:', JSON.stringify(feedTimes));
  // On a real ESP32 this will be: fetch('/api/setFeedTimes?data=' + encodeURIComponent(JSON.stringify(feedTimes)))
  updatePreviewNextFeedTime();
  showToast(t('toastTimesSaved'));
}

function loadFeedTimes(feedTimes) {
  const container = document.getElementById('feedTimesContainer');
  if (!container) return;
  container.innerHTML = '';
  feedTimeCounter = 0; // Reset counter
  if (feedTimes && feedTimes.length > 0) {
    feedTimes.forEach(ft => {
      addFeedTime(
        readFeedTimeField(ft, 'h', 'hour', 10),
        readFeedTimeField(ft, 'm', 'minute', 0),
        readFeedTimeField(ft, 'r', 'repeats', 1),
        false,
        readFeedTimeField(ft, 'd', 'day', -1),
        readFeedTimeField(ft, 'e', 'enabled', true)
      );
    });
  } else {
    // If no feedings are saved, add one default entry
    addFeedTime(10, 0, 1, false);
  }
  updatePreviewNextFeedTime();
}

// Servo angle change handler
const angleSlider = document.getElementById('angleSlider');
if (angleSlider) {
  angleSlider.addEventListener('input', function(){
    const val = this.value;
    const angleLabel = document.getElementById('angleLabel');
    if (angleLabel) {
      angleLabel.innerText = val;
    }
    // Show toast on angle change
    showToast(t('toastAngleUpdated'));
  });
}

// Button handlers
function saveSpeed() {
  const s = document.getElementById('speedSlider').value;
  const speedValue = document.getElementById('speedValue');
  if (speedValue) {
    speedValue.innerText = s;
  }
  showToast(t('toastSpeedSaved'));
}

function getFeedRepeatsValue() {
  const repeatsValue = document.getElementById('feedRepeatsValue');
  if (!repeatsValue) return 1;
  return clampFeedValue(repeatsValue.textContent, 1, 20, 1);
}

function setFeedRepeatsValue(nextValue) {
  const repeatsValue = document.getElementById('feedRepeatsValue');
  if (!repeatsValue) return;
  repeatsValue.textContent = String(clampFeedValue(nextValue, 1, 20, 1));
}

function saveRepeats(showFeedback = true) {
  setFeedRepeatsValue(getFeedRepeatsValue());
  if (showFeedback) {
    showToast(t('toastSaved'));
  }
}

function adjustFeedRepeats(delta) {
  const current = getFeedRepeatsValue();
  setFeedRepeatsValue(current + Number(delta || 0));
  saveRepeats(true);
}

function feedNow() {
  if (manualFeedInProgress) return;
  if (manualFeedCooldownLocal > 0) {
    showToast(t('toastFeedBlocked'));
    return;
  }
  manualFeedInProgress = true;
  renderFeedNowButtonState();

  Promise.resolve({ ok: true, status: 200, text: () => Promise.resolve('feeding') })
    .then(async (response) => {
      if (response.ok) {
        showToast(currentLang === 'en' ? 'Feeding now' : 'Годую');
        syncManualFeedCooldownFromStatus(5 * 60);
        return;
      }
      const message = await response.text();
      if (response.status === 429) {
        showToast(t('toastFeedBlocked'));
      } else {
        showToast(message || (currentLang === 'en' ? 'Feed error' : 'Помилка годування'));
      }
    })
    .catch(() => {
      showToast(currentLang === 'en' ? 'Feed error' : 'Помилка годування');
    })
    .finally(() => {
      if (manualFeedAnimationTimer) clearTimeout(manualFeedAnimationTimer);
      manualFeedAnimationTimer = setTimeout(() => {
        manualFeedInProgress = false;
        renderFeedNowButtonState();
      }, 1800);
    });
}

// Initialize one default feeding on load
window.onload = function() {
  applyLanguage();
  initHeroFishTailBurst();
  animateNextFeedGaugeIntro();
  syncManualFeedCooldownFromStatus(previewManualFeedCooldownSeconds);
  saveRepeats(false);
  loadFeedTimes([]);
  updatePreviewNextFeedTime();
};
</script>
